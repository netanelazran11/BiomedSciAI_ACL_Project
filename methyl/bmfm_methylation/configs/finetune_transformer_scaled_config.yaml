# Configuration for Transformer fine-tuning with scaled CpG embeddings
#
# Architecture: h_i = α * CpG_embed + β_embed + pos_embed → Transformer → MLP → age
# where α is learnable and initialized to initial_cpg_scale (default 0.1)

defaults:
  - _self_

# Data settings
data_module:
  _target_: bmfm_methylation.data_module.MethylationDataModule
  _partial_: true
  h5ad_path: ${data_path}
  train_split: train
  val_split: valid
  test_split: test
  age_column: age
  split_column: split
  batch_size: 32
  num_workers: 0
  max_length: 8002
  padding: max_length
  truncation: true
  pad_to_multiple_of: 2
  normalize_age: true
  mlm: false
  collation_strategy: sequence_classification

# Field definitions (same as pretraining)
fields:
  - _target_: bmfm_targets.config.FieldInfo
    field_name: cpg_sites
    vocab_size: 8005
    is_input: true
    is_masked: false
    tokenization_strategy: tokenize
  - _target_: bmfm_targets.config.FieldInfo
    field_name: beta_values
    is_input: true
    is_masked: true
    tokenization_strategy: continuous_value_encoder
    num_special_tokens: 5
    encoder_kwargs:
      kind: mlp_with_special_token_embedding
    decode_modes:
      regression: {}

# Trainer settings
trainer:
  _target_: bmfm_targets.config.TrainerConfig
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  lr_decay_steps: -1
  betas:
    - 0.9
    - 0.999
  epsilon: 1.0e-8
  losses:
    - name: mse
      field_name: beta_values
  batch_prediction_behavior: track
  metrics:
    - name: mae
    - name: mse
    - name: pcc

# Model architecture (same as pretraining)
model:
  _target_: bmfm_targets.config.SCBertConfig
  _partial_: true
  num_hidden_layers: 6
  num_attention_heads: 8
  hidden_size: 512
  intermediate_size: 2048
  hidden_act: gelu
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  classifier_dropout: 0.1
  initializer_range: 0.02
  layer_norm_eps: 1.0e-12
  pad_token_id: 0
  use_cache: true
  max_position_embeddings: 8002
  attention: torch
  label_columns: null
  checkpoint: ${checkpoint_path}

# Paths (override via CLI)
data_path: ???  # Required
output_directory: ???  # Required
tokenizer_path: ./tokenizer
checkpoint_path: ???  # Required - path to pretrained checkpoint

# Training settings
finetune_epochs: 100
accumulate_grad_batches: 2

# Embedding combination settings
combine_style: multiply  # "multiply" (scGPT style) or "add" (BMFM style)
freeze_encoder: true
unfreeze_encoder_epoch: 5
initial_cpg_scale: 0.1  # Only used in "add" mode

# Loss settings
use_huber_loss: false
huber_delta: 2.0

# Reproducibility
seed:
  seed_value: 42

# Regression head
regression_head:
  hidden_size: 256
  dropout: 0.1
  output_size: 1

# Weights & Biases
track_wandb:
  enabled: true
  project: transformer-scaled-cpg-finetune-bmfm-rna-methylation-8k
  entity: ???  # Set via CLI
  name: ???  # Set via CLI

# Early stopping
early_stopping:
  monitor: val/mae
  patience: 20
  mode: min
